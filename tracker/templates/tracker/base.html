{% load static %}
<!DOCTYPE html>
<html>
<head>
    
    <title>{% block title %}Job Application Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'tracker/style.css' %}">

</head>

<body>

    <header>
    <h1>Job Application Tracker</h1>
    <nav>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'job_list' %}">Applications</a>
    <a href="{% url 'add_application' %}">Add Application</a>
    <a href="{% url 'resume_list' %}">My Resumes</a>

    {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}" style="display: inline;">
    {% csrf_token %}
    <button type="submit">Logout</button>
</form>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
    {% endif %}
    </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
